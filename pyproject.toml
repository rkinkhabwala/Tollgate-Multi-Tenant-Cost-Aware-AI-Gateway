[project]
name = "tollgate"
version = "0.1.0"
description = "Multi-tenant, cost-aware, OpenAI-compatible AI gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0.8",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    # Phase 2 — redaction (spec §7.2)
    "presidio-analyzer>=2.2.360",
    "spacy>=3.8,<3.9",
    "en-core-web-lg",
    "numpy>=2.4.6",
    "jsonschema>=4.26.0",
    "tokenizers>=0.23.3",
]

[tool.uv.sources]
# spaCy models are not on PyPI; pin the release wheel matching spaCy 3.8.
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis[lua]>=2.24",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Order matters: the leak scan runs last, after everything else has produced logs,
# Redis state and ledger rows.
testpaths = ["tests/unit", "tests/eval", "tests/isolation", "tests/integration", "tests/leak"]
markers = [
    "stack: needs the running docker compose stack (postgres, redis, gateway)",
    "ollama: needs a real Ollama model behind the gateway (slow on CPU)",
]
