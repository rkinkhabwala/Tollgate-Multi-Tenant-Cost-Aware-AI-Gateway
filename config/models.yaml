# Tollgate model catalog (spec §8.1). Loaded into the `models` table at gateway startup.
#
# !!! PRICES FOR HOSTED MODELS ARE PLACEHOLDERS (spec §8.1) !!!
# Fill in current provider pricing before go-live. They exist in Phase 1 only so
# that `baseline_cost_usd` (what the app's premium baseline model would have cost)
# is non-zero and savings are demonstrable. Hosted adapters arrive in Phase 3.
# OpenAI rows are omitted until concrete model names are chosen ("openai/<small-model>").

models:
  - id: ollama/qwen2.5:7b
    provider: ollama
    provider_model: qwen2.5:7b
    tier: local
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0
    context_window: 32768
    supports_tools: true
    supports_json: true

